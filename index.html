<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Inventaire Grist</title>

  <!-- API Grist -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <!-- ZXing pour lire les codes-barres -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 21px;
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 52px;
      padding: 12px;

      border: 1px solid #bbb;
      border-radius: 10px;

      font-size: 17px;

      background: white;
    }

    select {
      appearance: auto;
    }

    input[readonly] {
      background: #eeeeee;
      color: #555;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      min-height: 58px;

      border: none;
      border-radius: 12px;

      font-size: 18px;
      font-weight: 600;

      margin-top: 15px;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #scanButton {
      background: #1f5ea8;
      color: white;
    }

    #addButton,
    #saveButton {
      background: #1f5ea8;
      color: white;
    }

    #confirmButton {
      background: #2e7d32;
      color: white;
    }

    #preview {
      display: none;
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
    }

    #status,
    #result,
    #newForm,
    #editForm,
    #mappingWarning {
      display: none;

      background: white;

      padding: 18px;

      border-radius: 12px;

      margin-top: 16px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }

    .success {
      color: #2e7d32;
      font-weight: 700;
    }

    .warning {
      color: #a15c00;
      font-weight: 700;
    }

    .error {
      color: #b00020;
      font-weight: 700;
    }

    .serial {
      font-size: 24px;
      font-weight: bold;
      margin: 12px 0;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📦 Inventaire matériel</h1>


  <!-- ==========================================
       MAPPING
       ========================================== -->

  <div id="mappingWarning">

    <div class="warning">
      ⚙️ Configuration des colonnes requise
    </div>

    <p>
      Vérifie les associations de colonnes
      dans les options du widget Grist.
    </p>

  </div>


  <!-- ==========================================
       SCANNER
       ========================================== -->

  <label for="serial">
    N° de série
  </label>

  <input
    id="serial"
    type="text"
    placeholder="Scanner ou saisir le numéro"
  >

  <input
    id="barcodeImage"
    type="file"
    accept="image/*"
    capture="environment"
    style="display:none;"
  >

  <button id="scanButton">
    📷 Scanner le code-barres
  </button>

  <img
    id="preview"
    alt="Photo du code-barres"
  >

  <div id="status"></div>

  <div id="result"></div>


  <!-- ==========================================
       MATÉRIEL EXISTANT
       ========================================== -->

  <div id="editForm">

    <h2>📝 Matériel existant</h2>


    <label>
      N° de série 🔒
    </label>

    <input
      id="editNumeroSerie"
      type="text"
      readonly
    >


    <label>
      N° d'inventaire
    </label>

    <input
      id="editNumeroInventaire"
      type="text"
    >


    <label>
      Type
    </label>

    <select id="editType">
      <option value="">-- Choisir --</option>
    </select>


    <label>
      Marque
    </label>

    <select id="editMarque">
      <option value="">-- Choisir --</option>
    </select>


    <label>
      Modèle
    </label>

    <select id="editModele">
      <option value="">-- Choisir --</option>
    </select>


    <label>
      Utilisateur
    </label>

    <input
      id="editUtilisateur"
      type="text"
    >


    <label>
      Site
    </label>

    <select id="editSite">
      <option value="">-- Choisir --</option>
    </select>


    <label>
      Localisation
    </label>

    <input
      id="editLocalisation"
      type="text"
    >


    <label>
      État
    </label>

    <select id="editEtat">

      <option value="">
        -- Choisir --
      </option>

      <option value="En service">
        En service
      </option>

      <option value="En stock">
        En stock
      </option>

      <option value="En panne">
        En panne
      </option>

      <option value="Réformé">
        Réformé
      </option>

    </select>


    <label>
      Commentaire
    </label>

    <textarea id="editCommentaire"></textarea>


    <button id="saveButton">
      💾 Enregistrer les modifications
    </button>


    <button id="confirmButton">
      ✅ Confirmer l'inventaire
    </button>

  </div>


  <!-- ==========================================
       NOUVEAU MATÉRIEL
       ========================================== -->

  <div id="newForm">

    <h2>➕ Nouveau matériel</h2>


    <label>
      N° de série 🔒
    </label>

    <input
      id="newNumeroSerie"
      type="text"
      readonly
    >


    <label>
      N° d'inventaire
    </label>

    <input
      id="newNumeroInventaire"
      type="text"
    >


    <label>
      Type
    </label>

    <select id="newType">
      <option value="">-- Choisir --</option>
    </select>


    <label>
      Marque
    </label>

    <select id="newMarque">
      <option value="">-- Choisir --</option>
    </select>


    <label>
      Modèle
    </label>

    <select id="newModele">
      <option value="">-- Choisir --</option>
    </select>


    <label>
      Utilisateur
    </label>

    <input
      id="newUtilisateur"
      type="text"
    >


    <label>
      Site
    </label>

    <select id="newSite">
      <option value="">-- Choisir --</option>
    </select>


    <label>
      Localisation
    </label>

    <input
      id="newLocalisation"
      type="text"
    >


    <label>
      État
    </label>

    <select id="newEtat">

      <option value="">
        -- Choisir --
      </option>

      <option value="En service">
        En service
      </option>

      <option value="En stock">
        En stock
      </option>

      <option value="En panne">
        En panne
      </option>

      <option value="Réformé">
        Réformé
      </option>

    </select>


    <label>
      Commentaire
    </label>

    <textarea id="newCommentaire"></textarea>


    <button id="addButton">
      💾 Ajouter à l'inventaire
    </button>

  </div>

</div>


<script>

/* ==================================================
   VARIABLES
================================================== */

let records = [];

let currentRecordId = null;

let columnMappings = null;


/*
  Listes de références.

  Chaque élément sera de la forme :

  {
    id: 12,
    label: "Garibaldi"
  }
*/

let listeSites = [];
let listeTypes = [];
let listeMarques = [];
let listeModeles = [];


/* ==================================================
   CONFIGURATION DES TABLES DE RÉFÉRENCE

   NOM TABLE : NOM COLONNE LIBELLÉ
================================================== */

const REF_CONFIG = {

  Site: {
    table: "Site",
    labelColumn: "Site"
  },

  TypeMateriel: {
    table: "Type",
    labelColumn: "Type"
  },

  Marque: {
    table: "Marque",
    labelColumn: "Marque"
  },

  Modele: {
    table: "Modèle",
    labelColumn: "Modèle"
  }

};


/* ==================================================
   ÉLÉMENTS HTML
================================================== */

const serialInput =
  document.getElementById("serial");

const scanButton =
  document.getElementById("scanButton");

const barcodeImage =
  document.getElementById("barcodeImage");

const preview =
  document.getElementById("preview");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const newForm =
  document.getElementById("newForm");

const editForm =
  document.getElementById("editForm");

const addButton =
  document.getElementById("addButton");

const saveButton =
  document.getElementById("saveButton");

const confirmButton =
  document.getElementById("confirmButton");

const mappingWarning =
  document.getElementById("mappingWarning");


/* ==================================================
   COLONNES ATTENDUES PAR LE WIDGET
================================================== */

const columns = [

  {
    name: "NumeroSerie",
    title: "N° de série"
  },

  {
    name: "NumeroInventaire",
    title: "N° d'inventaire",
    optional: true
  },

  {
    name: "TypeMateriel",
    title: "Type",
    optional: true
  },

  {
    name: "Marque",
    title: "Marque",
    optional: true
  },

  {
    name: "Modele",
    title: "Modèle",
    optional: true
  },

  {
    name: "Utilisateur",
    title: "Utilisateur",
    optional: true
  },

  {
    name: "Site",
    title: "Site",
    optional: true
  },

  {
    name: "Localisation",
    title: "Localisation",
    optional: true
  },

  {
    name: "Etat",
    title: "État",
    optional: true
  },

  {
    name: "DernierInventaire",
    title: "Dernier inventaire",
    optional: true
  },

  {
    name: "Commentaire",
    title: "Commentaire",
    optional: true
  }

];


/* ==================================================
   INITIALISATION GRIST
================================================== */

grist.ready({

  requiredAccess: "full",

  columns: columns

});


/* ==================================================
   CONVERSION D'UNE TABLE GRIST
   DU FORMAT COLONNES VERS LIGNES

   fetchTable() renvoie notamment :

   {
     id: [1,2,3],
     Site: ["A","B","C"]
   }

   On transforme cela en :

   [
     {id:1, Site:"A"},
     {id:2, Site:"B"},
     {id:3, Site:"C"}
   ]
================================================== */

function tableColonnesVersLignes(tableData) {

  if (
    !tableData ||
    !Array.isArray(tableData.id)
  ) {
    return [];
  }

  const lignes = [];

  for (
    let i = 0;
    i < tableData.id.length;
    i++
  ) {

    const ligne = {};

    for (
      const colonne
      of Object.keys(tableData)
    ) {

      if (
        Array.isArray(tableData[colonne])
      ) {

        ligne[colonne] =
          tableData[colonne][i];

      }

    }

    lignes.push(ligne);

  }

  return lignes;

}


/* ==================================================
   CHARGEMENT D'UNE TABLE DE RÉFÉRENCE
================================================== */

async function chargerReference(
  tableId,
  labelColumn
) {

  const tableData =
    await grist.docApi.fetchTable(
      tableId
    );

  const lignes =
    tableColonnesVersLignes(
      tableData
    );

  const valeurs =
    lignes
      .filter(function(ligne) {

        return (
          ligne.id &&
          ligne[labelColumn] !== null &&
          ligne[labelColumn] !== undefined &&
          String(
            ligne[labelColumn]
          ).trim() !== ""
        );

      })
      .map(function(ligne) {

        return {

          id:
            Number(ligne.id),

          label:
            String(
              ligne[labelColumn]
            )

        };

      });


  /*
    Tri alphabétique
  */

  valeurs.sort(function(a, b) {

    return a.label.localeCompare(
      b.label,
      "fr",
      {
        sensitivity: "base"
      }
    );

  });


  return valeurs;

}


/* ==================================================
   CHARGEMENT DE TOUTES LES RÉFÉRENCES
================================================== */

async function chargerListesReferences() {

  try {

    const [
      sites,
      types,
      marques,
      modeles
    ] = await Promise.all([

      chargerReference(
        REF_CONFIG.Site.table,
        REF_CONFIG.Site.labelColumn
      ),

      chargerReference(
        REF_CONFIG.TypeMateriel.table,
        REF_CONFIG.TypeMateriel.labelColumn
      ),

      chargerReference(
        REF_CONFIG.Marque.table,
        REF_CONFIG.Marque.labelColumn
      ),

      chargerReference(
        REF_CONFIG.Modele.table,
        REF_CONFIG.Modele.labelColumn
      )

    ]);


    listeSites = sites;
    listeTypes = types;
    listeMarques = marques;
    listeModeles = modeles;


    /*
      Remplissage des listes
      création + modification
    */

    remplirSelect(
      "newSite",
      listeSites
    );

    remplirSelect(
      "editSite",
      listeSites
    );


    remplirSelect(
      "newType",
      listeTypes
    );

    remplirSelect(
      "editType",
      listeTypes
    );


    remplirSelect(
      "newMarque",
      listeMarques
    );

    remplirSelect(
      "editMarque",
      listeMarques
    );


    remplirSelect(
      "newModele",
      listeModeles
    );

    remplirSelect(
      "editModele",
      listeModeles
    );

  }

  catch(error) {

    console.error(
      "Erreur chargement références :",
      error
    );

    statusBox.style.display =
      "block";

    statusBox.innerHTML = `

      <div class="error">

        ⚠️ Impossible de charger
        les listes de référence.

      </div>

      <p>

        Vérifie les noms des tables :
        Site, Type, Marque et Modèle.

      </p>

    `;

  }

}


/* ==================================================
   REMPLISSAGE D'UNE LISTE DÉROULANTE
================================================== */

function remplirSelect(
  selectId,
  liste
) {

  const select =
    document.getElementById(
      selectId
    );

  select.innerHTML =
    '<option value="">-- Choisir --</option>';


  for (
    const element of liste
  ) {

    const option =
      document.createElement(
        "option"
      );

    /*
      IMPORTANT :

      La valeur est l'ID de ligne Grist.
    */

    option.value =
      String(element.id);

    option.textContent =
      element.label;

    select.appendChild(
      option
    );

  }

}


/* ==================================================
   RÉCUPÉRATION DES DONNÉES PRINCIPALES
================================================== */

grist.onRecords(
  async function(data, mappings) {

    columnMappings =
      mappings;

    if (!mappings) {

      records = [];

      mappingWarning.style.display =
        "block";

      return;

    }


    const mappedRecords =
      [];

    for (
      const record
      of data || []
    ) {

      const mapped =
        grist.mapColumnNames(
          record,
          {
            mappings:
              mappings
          }
        );

      if (mapped) {

        mappedRecords.push(
          mapped
        );

      }

    }


    records =
      mappedRecords;


    mappingWarning.style.display =
      "none";


    /*
      Chargement des listes de référence.

      On le fait après que Grist
      ait initialisé le widget.
    */

    if (
      listeSites.length === 0 &&
      listeTypes.length === 0 &&
      listeMarques.length === 0 &&
      listeModeles.length === 0
    ) {

      await chargerListesReferences();

    }

  }
);


/* ==================================================
   COLONNE GRIST RÉELLE
================================================== */

function obtenirColonneGrist(
  nomLogique
) {

  if (!columnMappings) {

    return null;

  }

  const mapping =
    columnMappings[nomLogique];

  if (!mapping) {

    return null;

  }

  if (
    Array.isArray(mapping)
  ) {

    if (
      mapping.length === 0
    ) {

      return null;

    }

    return mapping[0];

  }

  return mapping;

}


/* ==================================================
   CONSTRUCTION SÉCURISÉE DES CHAMPS
================================================== */

function construireChampsGrist(
  champsLogiques
) {

  const fields = {};

  for (
    const [
      nomLogique,
      valeur
    ]
    of Object.entries(
      champsLogiques
    )
  ) {

    const vraieColonne =
      obtenirColonneGrist(
        nomLogique
      );

    if (
      vraieColonne &&
      vraieColonne !== "id" &&
      vraieColonne !== "manualSort"
    ) {

      fields[vraieColonne] =
        valeur;

    }

  }

  return fields;

}


/* ==================================================
   VÉRIFICATION DES CHAMPS
================================================== */

function verifierChamps(
  fields
) {

  if (
    !fields ||
    Object.keys(fields).length === 0
  ) {

    throw new Error(

      "Aucune colonne valide trouvée. Vérifie le mappage du widget."

    );

  }

}


/* ==================================================
   VALEUR NUMÉRIQUE D'UN SELECT DE RÉFÉRENCE
================================================== */

function valeurReference(
  selectId
) {

  const valeur =
    document
      .getElementById(
        selectId
      )
      .value;

  if (
    valeur === ""
  ) {

    /*
      0 = référence vide
      dans une colonne Ref Grist.
    */

    return 0;

  }

  return Number(
    valeur
  );

}


/* ==================================================
   SCAN
================================================== */

scanButton.addEventListener(
  "click",
  function() {

    barcodeImage.click();

  }
);


/* ==================================================
   PHOTO
================================================== */

barcodeImage.addEventListener(
  "change",
  async function() {

    const file =
      this.files[0];

    if (!file) {

      return;

    }


    masquerFormulaires();


    statusBox.style.display =
      "block";


    statusBox.innerHTML =
      "📸 Photo reçue…";


    const imageUrl =
      URL.createObjectURL(
        file
      );


    preview.src =
      imageUrl;


    preview.style.display =
      "block";


    preview.onload =
      async function() {

        statusBox.innerHTML =
          "🔎 Analyse du code-barres…";

        try {

          const reader =
            new ZXingBrowser
              .BrowserMultiFormatReader();


          const result =
            await reader
              .decodeFromImageElement(
                preview
              );


          const serial =
            result
              .getText()
              .trim();


          serialInput.value =
            serial;


          statusBox.innerHTML = `

            <span class="success">

              ✅ Code-barres reconnu :
              ${echapperHTML(serial)}

            </span>

          `;


          rechercherMateriel(
            serial
          );

        }

        catch(error) {

          console.error(
            error
          );


          statusBox.innerHTML = `

            <div class="error">

              ❌ Aucun code-barres reconnu

            </div>

            <p>

              Essaie de reprendre la photo
              de plus près, sans reflet
              et avec le code bien net.

            </p>

          `;

        }

        finally {

          URL.revokeObjectURL(
            imageUrl
          );

          barcodeImage.value =
            "";

        }

      };

  }
);


/* ==================================================
   RECHERCHE
================================================== */

function rechercherMateriel(
  serial
) {

  const serialNettoye =
    String(serial)
      .trim()
      .toUpperCase();


  const found =
    records.find(
      function(record) {

        return (

          String(
            record.NumeroSerie || ""
          )
            .trim()
            .toUpperCase()

          ===

          serialNettoye

        );

      }
    );


  resultBox.style.display =
    "block";


  /*
    MATÉRIEL EXISTANT
  */

  if (found) {

    currentRecordId =
      found.id;


    newForm.style.display =
      "none";


    resultBox.innerHTML = `

      <div class="success">

        ✅ Matériel trouvé

      </div>

      <div class="serial">

        ${echapperHTML(
          found.NumeroSerie || ""
        )}

      </div>

      <p>

        Tu peux modifier les informations
        ci-dessous ou simplement confirmer
        l'inventaire.

      </p>

    `;


    remplirFormulaireEdition(
      found
    );

  }


  /*
    NOUVEAU
  */

  else {

    currentRecordId =
      null;


    editForm.style.display =
      "none";


    resultBox.innerHTML = `

      <div class="warning">

        🆕 Nouveau matériel

      </div>

      <p>

        Le numéro de série

        <strong>
          ${echapperHTML(serial)}
        </strong>

        n'existe pas encore dans l'inventaire.

      </p>

    `;


    remplirFormulaireCreation(
      serial
    );

  }

}


/* ==================================================
   FORMULAIRE ÉDITION
================================================== */

function remplirFormulaireEdition(
  record
) {

  document.getElementById(
    "editNumeroSerie"
  ).value =
    record.NumeroSerie || "";


  document.getElementById(
    "editNumeroInventaire"
  ).value =
    record.NumeroInventaire || "";


  /*
    Les références sont des IDs numériques.
  */

  selectionnerReference(
    "editType",
    record.TypeMateriel
  );


  selectionnerReference(
    "editMarque",
    record.Marque
  );


  selectionnerReference(
    "editModele",
    record.Modele
  );


  document.getElementById(
    "editUtilisateur"
  ).value =
    record.Utilisateur || "";


  selectionnerReference(
    "editSite",
    record.Site
  );


  document.getElementById(
    "editLocalisation"
  ).value =
    record.Localisation || "";


  document.getElementById(
    "editEtat"
  ).value =
    record.Etat || "";


  document.getElementById(
    "editCommentaire"
  ).value =
    record.Commentaire || "";


  editForm.style.display =
    "block";

}


/* ==================================================
   SÉLECTION D'UNE RÉFÉRENCE EXISTANTE
================================================== */

function selectionnerReference(
  selectId,
  valeur
) {

  const select =
    document.getElementById(
      selectId
    );


  /*
    Cas classique :
    la valeur est directement un rowId.
  */

  if (
    typeof valeur === "number"
  ) {

    select.value =
      String(valeur);

    return;

  }


  /*
    Certains formats Grist peuvent
    encapsuler une référence.

    Exemple potentiel :
    ["R", "Site", 3]
  */

  if (
    Array.isArray(valeur)
  ) {

    const dernierElement =
      valeur[
        valeur.length - 1
      ];

    if (
      typeof dernierElement === "number"
    ) {

      select.value =
        String(
          dernierElement
        );

      return;

    }

  }


  select.value =
    "";

}

/* ==================================================
   CRÉATION
================================================== */

addButton.addEventListener(
  "click",
  async function() {

    if (!columnMappings) {

      alert(

        "Les colonnes ne sont pas configurées dans Grist."

      );

      return;

    }


    const numeroSerie =
      document.getElementById(
        "newNumeroSerie"
      )
        .value
        .trim();


    if (!numeroSerie) {

      alert(

        "Le numéro de série est obligatoire."

      );

      return;

    }


    addButton.disabled =
      true;


    addButton.textContent =
      "⏳ Enregistrement…";


    try {

      const table =
        grist.getTable();


      const fields =
        construireChampsGrist({

          NumeroSerie:
            numeroSerie,


          NumeroInventaire:
            document.getElementById(
              "newNumeroInventaire"
            ).value.trim(),


          /*
            Les quatre champs suivants
            contiennent des rowIds Grist.
          */

          TypeMateriel:
            valeurReference(
              "newType"
            ),


          Marque:
            valeurReference(
              "newMarque"
            ),


          Modele:
            valeurReference(
              "newModele"
            ),


          Utilisateur:
            document.getElementById(
              "newUtilisateur"
            ).value.trim(),


          Site:
            valeurReference(
              "newSite"
            ),


          Localisation:
            document.getElementById(
              "newLocalisation"
            ).value.trim(),


          Etat:
            document.getElementById(
              "newEtat"
            ).value,


          DernierInventaire:
            Math.floor(
              Date.now() / 1000
            ),


          Commentaire:
            document.getElementById(
              "newCommentaire"
            ).value.trim()

        });


      verifierChamps(
        fields
      );


      await table.create({

        fields:
          fields

      });


      newForm.style.display =
        "none";


      statusBox.style.display =
        "none";


      resultBox.style.display =
        "block";


      resultBox.innerHTML = `

        <div class="success">

          ✅ Matériel ajouté à l'inventaire

        </div>

        <div class="serial">

          ${echapperHTML(
            numeroSerie
          )}

        </div>

      `;

    }

    catch(error) {

      console.error(
        error
      );


      alert(

        "Erreur lors de l'ajout : "
        +
        (
          error.message
          ||
          String(error)
        )

      );

    }

    finally {

      addButton.disabled =
        false;


      addButton.textContent =
        "💾 Ajouter à l'inventaire";

    }

  }
);

/* ==================================================
   PROTECTION HTML
================================================== */

function echapperHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
