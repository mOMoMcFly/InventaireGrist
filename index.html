<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Inventaire Grist</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://unpkg.com/@zxing/browser@latest"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 21px;
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 52px;
      padding: 12px;

      border: 1px solid #bbb;
      border-radius: 10px;

      font-size: 17px;
      background: white;
    }

      background: #eeeeee;
      color: #555;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      min-height: 58px;

      border: none;
      border-radius: 12px;

      font-size: 18px;
      font-weight: 600;

      margin-top: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #scanButton {
      background: #1f5ea8;
      color: white;
    }

    #addButton,
    #saveButton {
      background: #1f5ea8;
      color: white;
    }

    #confirmButton {
      background: #2e7d32;
      color: white;
    }

    #preview {
      display: none;
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
    }

    #status,
    #result,
    #newForm,
    #editForm,
    #mappingWarning {
      display: none;

      background: white;
      padding: 18px;

      border-radius: 12px;
      margin-top: 16px;

      box-shadow:

    }

    .success {
      color: #2e7d32;
      font-weight: 700;
    }

    .warning {
      color: #a15c00;
      font-weight: 700;
    }

    .error {
      color: #b00020;
      font-weight: 700;
    }

    .info {
      color: #1f5ea8;
      font-weight: 700;
    }

    .serial {
      font-size: 24px;
      font-weight: bold;
      margin: 12px 0;
    }

    .hint {
      margin-top: 5px;
      font-size: 13px;
      color: #666;
    }

  </style>

</head>


<body>

    <input

    <label>

<script>

/* ==================================================
   VARIABLES
================================================== */

let records = [];

let currentRecordId = null;

let columnMappings = null;

let referencesChargees = false;


/*
  Listes de références
*/

let listeSites = [];

let listeTypes = [];

let listeMarques = [];

/*
  Un modèle contient maintenant :

  {
    id: 1,
    label: "AP 635",
    marqueId: 4,
    typeId: 2
  }
*/

let listeModeles = [];


/* ==================================================
   CONFIGURATION
================================================== */

const CONFIG_REFERENCES = {

  Site: {
    table: "Site",
    libelle: "Site"
  },

  TypeMateriel: {
    table: "Type",
    libelle: "Type"
  },

  Marque: {
    table: "Marque",
    libelle: "Marque"
  },

  Modele: {
    table: "Modèle",
    libelle: "Modèle",

    /*
      Dans la table Modèle,
      le widget recherchera automatiquement
      une colonne nommée Marque.
    */

    marque: "Marque",

    /*
      Si une colonne Type existe également
      dans Modèle, elle sera utilisée
      pour affiner encore le filtre.
    */

    type: "Type"
  }

};


/* ==================================================
   ÉLÉMENTS
================================================== */

const serialInput =
  document.getElementById("serial");

const scanButton =
  document.getElementById("scanButton");

const barcodeImage =
  document.getElementById("barcodeImage");

const preview =
  document.getElementById("preview");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const newForm =
  document.getElementById("newForm");

const editForm =
  document.getElementById("editForm");

const addButton =
  document.getElementById("addButton");

const saveButton =
  document.getElementById("saveButton");

const confirmButton =
  document.getElementById("confirmButton");

const mappingWarning =
  document.getElementById("mappingWarning");


/* ==================================================
   COLONNES PRINCIPALES
================================================== */

const columns = [

  {
    name: "NumeroSerie",
    title: "N° de série"
  },

  {
    name: "NumeroInventaire",
    title: "N° d'inventaire",
    optional: true
  },

  {
    name: "TypeMateriel",
    title: "Type",
    optional: true,
    type: "Ref"
  },

  {
    name: "Marque",
    title: "Marque",
    optional: true,
    type: "Ref"
  },

  {
    name: "Modele",
    title: "Modèle",
    optional: true,
    type: "Ref"
  },

  {
    name: "Utilisateur",
    title: "Utilisateur",
    optional: true
  },

  {
    name: "Site",
    title: "Site",
    optional: true,
    type: "Ref"
  },

  {
    name: "Localisation",
    title: "Localisation",
    optional: true
  },

  {
    name: "Etat",
    title: "État",
    optional: true
  },

  {
    name: "DernierInventaire",
    title: "Dernier inventaire",
    optional: true
  },

  {
    name: "Commentaire",
    title: "Commentaire",
    optional: true
  }

];


/* ==================================================
   INITIALISATION
================================================== */

grist.ready({

  requiredAccess: "full",

  columns: columns

});


/* ==================================================
   NORMALISATION DES NOMS
================================================== */

function normaliserNom(valeur) {

  return String(valeur || "")

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .replace(
      /[^a-zA-Z0-9]/g,
      ""
    )

    .toLowerCase();

}


/* ==================================================
   TROUVER UNE TABLE GRIST
================================================== */

async function trouverTableId(nomRecherche) {

  const tables =
    await grist.docApi.listTables();

  const cible =
    normaliserNom(
      nomRecherche
    );

  const tableTrouvee =
    tables.find(
      function(tableId) {

        return (
          normaliserNom(tableId)
          ===
          cible
        );

      }
    );

  if (!tableTrouvee) {

    throw new Error(

      'Table introuvable : "' +
      nomRecherche +
      '". Tables disponibles : ' +
      tables.join(", ")

    );

  }

  return tableTrouvee;

}


/* ==================================================
   FETCH TABLE -> LIGNES
================================================== */

function convertirFetchTableEnLignes(data) {

  if (Array.isArray(data)) {

    return data;

  }

  if (
    data &&
    Array.isArray(data.id)
  ) {

    const lignes =
      [];

    for (
      let i = 0;
      i < data.id.length;
      i++
    ) {

      const ligne =
        {};

      for (
        const key
        of Object.keys(data)
      ) {

        if (
          Array.isArray(
            data[key]
          )
        ) {

          ligne[key] =
            data[key][i];

        }

      }

      lignes.push(
        ligne
      );

    }

    return lignes;

  }

  return [];

}


/* ==================================================
   TROUVER UNE COLONNE
================================================== */

function trouverColonne(
  lignes,
  nomRecherche
) {

  if (
    !lignes ||
    lignes.length === 0
  ) {

    return null;

  }

  const cible =
    normaliserNom(
      nomRecherche
    );

  const colonnes =
    Object.keys(
      lignes[0]
    );

  return (
    colonnes.find(
      function(colonne) {

        return (
          normaliserNom(colonne)
          ===
          cible
        );

      }
    )
    ||
    null
  );

}


/* ==================================================
   CHARGER UNE RÉFÉRENCE SIMPLE
================================================== */

async function chargerReferenceSimple(
  nomTable,
  nomColonne
) {

  const tableId =
    await trouverTableId(
      nomTable
    );

  const raw =
    await grist.docApi.fetchTable(
      tableId
    );

  const lignes =
    convertirFetchTableEnLignes(
      raw
    );

  if (
    lignes.length === 0
  ) {

    return [];

  }

  const colonneLibelle =
    trouverColonne(
      lignes,
      nomColonne
    );

  if (!colonneLibelle) {

    throw new Error(

      'Colonne "' +
      nomColonne +
      '" introuvable dans "' +
      tableId +
      '".'

    );

  }

  const valeurs =
    lignes

      .filter(
        function(ligne) {

          return (

            ligne.id !== null &&
            ligne.id !== undefined &&

            ligne[colonneLibelle] !== null &&
            ligne[colonneLibelle] !== undefined &&

            String(
              ligne[colonneLibelle]
            ).trim() !== ""

          );

        }
      )

      .map(
        function(ligne) {

          return {

            id:
              Number(
                ligne.id
              ),

            label:
              String(
                ligne[colonneLibelle]
              )

          };

        }
      );

  valeurs.sort(
    function(a, b) {

      return a.label.localeCompare(
        b.label,
        "fr",
        {
          sensitivity: "base"
        }
      );

    }
  );

  return valeurs;

}


/* ==================================================
   CHARGER LES MODÈLES AVEC MARQUE / TYPE
================================================== */

async function chargerModeles() {

  const tableId =
    await trouverTableId(
      CONFIG_REFERENCES
        .Modele
        .table
    );

  const raw =
    await grist.docApi.fetchTable(
      tableId
    );

  const lignes =
    convertirFetchTableEnLignes(
      raw
    );

  if (
    lignes.length === 0
  ) {

    return [];

  }

  const colonneModele =
    trouverColonne(
      lignes,
      CONFIG_REFERENCES
        .Modele
        .libelle
    );


  const colonneMarque =
    trouverColonne(
      lignes,
      CONFIG_REFERENCES
        .Modele
        .marque
    );


  const colonneType =
    trouverColonne(
      lignes,
      CONFIG_REFERENCES
        .Modele
        .type
    );


  if (!colonneModele) {

    throw new Error(
      "Impossible de trouver la colonne Modèle."
    );

  }


  /*
    La colonne Marque est nécessaire
    pour avoir le filtre demandé.
  */

  if (!colonneMarque) {

    throw new Error(

      'La table Modèle ne contient pas de colonne "Marque".'

    );

  }


  const valeurs =
    lignes

      .filter(
        function(ligne) {

          return (

            ligne.id !== null &&
            ligne.id !== undefined &&

            ligne[colonneModele] !== null &&
            ligne[colonneModele] !== undefined &&

            String(
              ligne[colonneModele]
            ).trim() !== ""

          );

        }
      )

      .map(
        function(ligne) {

          return {

            id:
              Number(
                ligne.id
              ),

            label:
              String(
                ligne[colonneModele]
              ),

            /*
              fetchTable renvoie pour une Ref
              le row ID de la ligne référencée.
            */

            marqueId:
              extraireRowId(
                ligne[colonneMarque]
              ),

            typeId:
              colonneType
                ?
                extraireRowId(
                  ligne[colonneType]
                )
                :
                null

          };

        }
      );


  valeurs.sort(
    function(a, b) {

      return a.label.localeCompare(
        b.label,
        "fr",
        {
          sensitivity: "base"
        }
      );

    }
  );


  return valeurs;

}


/* ==================================================
   EXTRAIRE UN ROW ID
================================================== */

function extraireRowId(valeur) {

  if (
    valeur === null ||
    valeur === undefined ||
    valeur === ""
  ) {

    return null;

  }


  if (
    typeof valeur === "number"
  ) {

    return valeur;

  }


  if (
    typeof valeur === "string" &&
    !isNaN(
      Number(valeur)
    )
  ) {

    return Number(
      valeur
    );

  }


  if (
    Array.isArray(valeur)
  ) {

    for (
      let i = valeur.length - 1;
      i >= 0;
      i--
    ) {

      if (
        typeof valeur[i] === "number"
      ) {

        return valeur[i];

      }

    }

  }


  return null;

}


/* ==================================================
   CHARGER TOUTES LES LISTES
================================================== */

async function chargerListesReferences() {

  if (
    referencesChargees
  ) {

    return;

  }

  try {

    statusBox.style.display =
      "block";

    statusBox.innerHTML =
      "⏳ Chargement des listes…";


    const [
      sites,
      types,
      marques,
      modeles
    ] = await Promise.all([


      chargerReferenceSimple(
        CONFIG_REFERENCES.Site.table,
        CONFIG_REFERENCES.Site.libelle
      ),


      chargerReferenceSimple(
        CONFIG_REFERENCES.TypeMateriel.table,
        CONFIG_REFERENCES.TypeMateriel.libelle
      ),


      chargerReferenceSimple(
        CONFIG_REFERENCES.Marque.table,
        CONFIG_REFERENCES.Marque.libelle
      ),


      chargerModeles()

    ]);


    listeSites =
      sites;

    listeTypes =
      types;

    listeMarques =
      marques;

    listeModeles =
      modeles;


    remplirSelectSimple(
      "newSite",
      listeSites
    );

    remplirSelectSimple(
      "editSite",
      listeSites
    );


    remplirSelectSimple(
      "newType",
      listeTypes
    );

    remplirSelectSimple(
      "editType",
      listeTypes
    );


    remplirSelectSimple(
      "newMarque",
      listeMarques
    );

    remplirSelectSimple(
      "editMarque",
      listeMarques
    );


    /*
      Modèle est rempli dynamiquement
      selon Marque / Type.
    */

    mettreAJourModeles(
      "new"
    );

    mettreAJourModeles(
      "edit"
    );


    referencesChargees =
      true;


    statusBox.style.display =
      "none";

  }

  catch(error) {

    console.error(
      error
    );


    statusBox.style.display =
      "block";


    statusBox.innerHTML = `

      <div class="error">

        ⚠️ Impossible de charger
        les listes de référence.

      </div>

      <p>
        ${echapperHTML(
          error.message ||
          String(error)
        )}
      </p>

    `;

  }

}


/* ==================================================
   REMPLIR UN SELECT SIMPLE
================================================== */

function remplirSelectSimple(
  selectId,
  liste
) {

  const select =
    document.getElementById(
      selectId
    );

  select.innerHTML =
    '<option value="">-- Choisir --</option>';


  for (
    const element
    of liste
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      String(
        element.id
      );

    option.textContent =
      element.label;

    select.appendChild(
      option
    );

  }

}


/* ==================================================
   MODÈLES CONDITIONNELS
================================================== */

function mettreAJourModeles(
  prefixe,
  valeurModeleAConserver = null
) {

  const marqueSelect =
    document.getElementById(
      prefixe + "Marque"
    );

  const typeSelect =
    document.getElementById(
      prefixe + "Type"
    );

  const modeleSelect =
    document.getElementById(
      prefixe + "Modele"
    );


  const marqueId =
    marqueSelect.value
      ?
      Number(
        marqueSelect.value
      )
      :
      null;


  const typeId =
    typeSelect.value
      ?
      Number(
        typeSelect.value
      )
      :
      null;


  /*
    Si aucune marque n'est choisie,
    on ne propose aucun modèle.

    Cela évite d'avoir une immense liste.
  */

  let modelesFiltres =
    [];


  if (
    marqueId !== null
  ) {

    modelesFiltres =
      listeModeles.filter(
        function(modele) {

          /*
            Marque obligatoire
          */

          if (
            modele.marqueId !== marqueId
          ) {

            return false;

          }


          /*
            Si Modèle possède aussi
            une référence Type ET qu'un Type
            est sélectionné, on filtre également.
          */

          if (
            modele.typeId !== null &&
            typeId !== null &&
            modele.typeId !== typeId
          ) {

            return false;

          }


          return true;

        }
      );

  }


  modeleSelect.innerHTML =
    '<option value="">-- Choisir --</option>';


  for (
    const modele
    of modelesFiltres
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      String(
        modele.id
      );

    option.textContent =
      modele.label;

    modeleSelect.appendChild(
      option
    );

  }


  /*
    Restauration éventuelle
    du modèle déjà présent dans Grist.
  */

  if (
    valeurModeleAConserver !== null &&
    valeurModeleAConserver !== undefined
  ) {

    selectionnerReferenceOuLibelle(
      modeleSelect,
      valeurModeleAConserver,
      listeModeles
    );

  }

}

/* ==================================================
   DONNÉES DE LA TABLE PRINCIPALE
================================================== */

grist.onRecords(
  async function(data, mappings) {

    columnMappings =
      mappings;


    if (!mappings) {

      records = [];

      mappingWarning.style.display =
        "block";

      return;

    }


    const mappedRecords =
      [];


    for (
      const record
      of data || []
    ) {

      const mapped =
        grist.mapColumnNames(

          record,

          {
            mappings:
              mappings
          }

        );


      if (mapped) {

        mappedRecords.push(
          mapped
        );

      }

    }


    records =
      mappedRecords;


    mappingWarning.style.display =
      "none";


    if (
      !referencesChargees
    ) {

      await chargerListesReferences();

    }

  }
);


/* ==================================================
   TROUVER UNE COLONNE GRIST
================================================== */

function obtenirColonneGrist(
  nomLogique
) {

  if (!columnMappings) {

    return null;

  }


  const mapping =
    columnMappings[
      nomLogique
    ];


  if (!mapping) {

    return null;

  }


  if (
    Array.isArray(mapping)
  ) {

    if (
      mapping.length === 0
    ) {

      return null;

    }

    return mapping[0];

  }


  return mapping;

}


/* ==================================================
   CHAMPS À ÉCRIRE
================================================== */

function construireChampsGrist(
  champsLogiques
) {

  const fields =
    {};


  for (
    const [
      nomLogique,
      valeur
    ]
    of Object.entries(
      champsLogiques
    )
  ) {

    const vraieColonne =
      obtenirColonneGrist(
        nomLogique
      );


    if (
      vraieColonne &&
      vraieColonne !== "id" &&
      vraieColonne !== "manualSort"
    ) {

      fields[
        vraieColonne
      ] =
        valeur;

    }

  }


  return fields;

}


/* ==================================================
   VÉRIFICATION
================================================== */

function verifierChamps(
  fields
) {

  if (
    !fields ||
    Object.keys(fields).length === 0
  ) {

    throw new Error(

      "Aucune colonne valide trouvée. Vérifie le mappage du widget."

    );

  }

}


/* ==================================================
   VALEUR D'UNE RÉFÉRENCE
================================================== */

function valeurReference(
  selectId
) {

  const value =
    document
      .getElementById(
        selectId
      )
      .value;


  if (
    value === ""
  ) {

    return 0;

  }


  return Number(
    value
  );

}


/* ==================================================
   SÉLECTION D'UNE RÉFÉRENCE EXISTANTE

   Cette version sait retrouver une valeur
   soit par ID, soit par LIBELLÉ.

   C'est ce qui corrige ton problème :
   "Aruba" / "Garibaldi" / "AP 635"
   peuvent maintenant sélectionner
   automatiquement la bonne option.
================================================== */

function selectionnerReferenceOuLibelle(
  select,
  valeur,
  liste
) {

  if (
    valeur === null ||
    valeur === undefined ||
    valeur === ""
  ) {

    select.value =
      "";

    return;

  }


  /*
    1 - Valeur numérique = row ID
  */

  const rowId =
    extraireRowId(
      valeur
    );


  if (
    rowId !== null
  ) {

    const existe =
      Array.from(
        select.options
      )
      .some(
        function(option) {

          return (
            option.value
            ===
            String(rowId)
          );

        }
      );


    if (existe) {

      select.value =
        String(rowId);

      return;

    }

  }


  /*
    2 - Grist peut nous transmettre
        le libellé affiché de la Ref.

        Ex :
        "Aruba"
        "AP 635"
        "Garibaldi"
  */

  let texte =
    null;


  if (
    typeof valeur === "string"
  ) {

    texte =
      valeur;

  }


  /*
    Certaines valeurs de référence
    peuvent être encodées.
  */

  if (
    Array.isArray(valeur)
  ) {

    for (
      const element
      of valeur
    ) {

      if (
        typeof element === "string" &&
        element !== "R"
      ) {

        texte =
          element;

      }

    }

  }


  if (
    texte !== null
  ) {

    const cible =
      normaliserNom(
        texte
      );


    const elementTrouve =
      liste.find(
        function(element) {

          return (
            normaliserNom(
              element.label
            )
            ===
            cible
          );

        }
      );


    if (elementTrouve) {

      const existe =
        Array.from(
          select.options
        )
        .some(
          function(option) {

            return (
              option.value
              ===
              String(
                elementTrouve.id
              )
            );

          }
        );


      if (existe) {

        select.value =
          String(
            elementTrouve.id
          );

        return;

      }

    }

  }


  select.value =
    "";

}

barcodeImage.addEventListener(
  "change",
  async function() {

    const file =
      this.files[0];


    if (!file) {

      return;

    }


    masquerFormulaires();


    statusBox.style.display =
      "block";


    statusBox.innerHTML =
      "📸 Photo reçue…";


    const imageUrl =
      URL.createObjectURL(
        file
      );


    preview.src =
      imageUrl;


    preview.style.display =
      "block";


    preview.onload =
      async function() {

        statusBox.innerHTML =
          "🔎 Analyse du code-barres…";


        try {

          const reader =
            new ZXingBrowser
              .BrowserMultiFormatReader();


          const result =
            await reader
              .decodeFromImageElement(
                preview
              );


          const serial =
            result
              .getText()
              .trim();


          serialInput.value =
            serial;


          statusBox.innerHTML = `

            <span class="success">

              ✅ Code-barres reconnu :
              ${echapperHTML(serial)}

            </span>

          `;


          rechercherMateriel(
            serial
          );

        }

        catch(error) {

          console.error(
            error
          );


          statusBox.innerHTML = `

            <div class="error">

              ❌ Aucun code-barres reconnu

            </div>

            <p>

              Essaie de reprendre la photo
              de plus près, sans reflet
              et avec le code bien net.

            </p>

          `;

        }

        finally {

          URL.revokeObjectURL(
            imageUrl
          );


          barcodeImage.value =
            "";

        }

      };

  }
);


/* ==================================================
   RECHERCHE
================================================== */

function rechercherMateriel(
  serial
) {

  const serialNettoye =
    String(serial)
      .trim()
      .toUpperCase();


  const found =
    records.find(
      function(record) {

        return (

          String(
            record.NumeroSerie || ""
          )
            .trim()
            .toUpperCase()

          ===

          serialNettoye

        );

      }
    );


  resultBox.style.display =
    "block";


  if (found) {

    currentRecordId =
      found.id;


    newForm.style.display =
      "none";


    resultBox.innerHTML = `

      <div class="success">

        ✅ Matériel trouvé

      </div>

      <div class="serial">

        ${echapperHTML(
          found.NumeroSerie || ""
        )}

      </div>

      <p>

        Tu peux modifier les informations
        ci-dessous ou simplement confirmer
        l'inventaire.

      </p>

    `;


    remplirFormulaireEdition(
      found
    );

  }


  else {

    currentRecordId =
      null;


    editForm.style.display =
      "none";


    resultBox.innerHTML = `

      <div class="warning">

        🆕 Nouveau matériel

      </div>

      <p>

        Le numéro de série

        <strong>
          ${echapperHTML(serial)}
        </strong>

        n'existe pas encore
        dans l'inventaire.

      </p>

    `;


    remplirFormulaireCreation(
      serial
    );

  }

}

    "editNumeroInventaire"

  /*

  */

  selectionnerReferenceOuLibelle(

    document.getElementById(
      "editType"
    ),

    record.TypeMateriel,

    listeTypes

  );


  /*
    MARQUE
  */

  selectionnerReferenceOuLibelle(

    document.getElementById(
      "editMarque"
    ),

    record.Marque,

    listeMarques

  );


  /*
    Maintenant que la marque est connue,
    on fabrique la liste des modèles
    correspondants puis on sélectionne
    le modèle existant.
  */

  mettreAJourModeles(
    "edit",
    record.Modele
  );


  document.getElementById(
    "editUtilisateur"
  ).value =
    record.Utilisateur || "";


  /*
    SITE
  */

  selectionnerReferenceOuLibelle(

    document.getElementById(
      "editSite"
    ),

    record.Site,

    listeSites

  );


  document.getElementById(
    "editLocalisation"
  ).value =
    record.Localisation || "";


  document.getElementById(
    "editEtat"
  ).value =
    record.Etat || "";


  document.getElementById(
    "editCommentaire"
  ).value =
    record.Commentaire || "";


  editForm.style.display =
    "block";

}

addButton.addEventListener(
  "click",
  async function() {

    if (!columnMappings) {

      alert(
        "Les colonnes ne sont pas configurées dans Grist."
      );

      return;

    }


    const numeroSerie =
      document.getElementById(
        "newNumeroSerie"
      )
        .value
        .trim();


    if (!numeroSerie) {

      alert(
        "Le numéro de série est obligatoire."
      );

      return;

    }


    addButton.disabled =
      true;


    addButton.textContent =
      "⏳ Enregistrement…";


    try {

      const table =
        grist.getTable();


      const fields =
        construireChampsGrist({

          NumeroSerie:
            numeroSerie,


          NumeroInventaire:
            document.getElementById(
              "newNumeroInventaire"
            ).value.trim(),


          TypeMateriel:
            valeurReference(
              "newType"
            ),


          Marque:
            valeurReference(
              "newMarque"
            ),


          Modele:
            valeurReference(
              "newModele"
            ),


          Utilisateur:
            document.getElementById(
              "newUtilisateur"
            ).value.trim(),


          Site:
            valeurReference(
              "newSite"
            ),


          Localisation:
            document.getElementById(
              "newLocalisation"
            ).value.trim(),


          Etat:
            document.getElementById(
              "newEtat"
            ).value,


          DernierInventaire:
            Math.floor(
              Date.now() / 1000
            ),


          Commentaire:
            document.getElementById(
              "newCommentaire"
            ).value.trim()

        });


      verifierChamps(
        fields
      );


      await table.create({

        fields:
          fields

      });


      newForm.style.display =
        "none";


      statusBox.style.display =
        "none";


      resultBox.style.display =
        "block";


      resultBox.innerHTML = `

        <div class="success">

          ✅ Matériel ajouté à l'inventaire

        </div>

        <div class="serial">

          ${echapperHTML(
            numeroSerie
          )}

        </div>

      `;

    }

    catch(error) {

      console.error(
        error
      );


      alert(

        "Erreur lors de l'ajout : "
        +
        (
          error.message
          ||
          String(error)
        )

      );

    }

    finally {

      addButton.disabled =
        false;


      addButton.textContent =
        "💾 Ajouter à l'inventaire";

    }

  }
);

/* ==================================================
   PROTECTION HTML
================================================== */

function echapperHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
