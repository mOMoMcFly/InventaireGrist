<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Inventaire Grist</title>

  <!-- API Grist -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <!-- ZXing pour lire les codes-barres -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }


    body {
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }


    .container {
      max-width: 520px;
      margin: auto;
    }


    h1 {
      font-size: 28px;
      margin-bottom: 24px;
    }


    h2 {
      font-size: 21px;
      margin-top: 0;
    }


    label {
      display: block;

      font-size: 16px;
      font-weight: 600;

      margin-top: 14px;
      margin-bottom: 6px;
    }


    input,
    select,
    textarea {

      width: 100%;
      min-height: 52px;

      padding: 12px;

      border: 1px solid #bbb;
      border-radius: 10px;

      font-size: 17px;

      background: white;
    }


    textarea {
      min-height: 100px;
      resize: vertical;
    }


    button {

      width: 100%;
      min-height: 58px;

      border: none;
      border-radius: 12px;

      font-size: 18px;
      font-weight: 600;

      margin-top: 15px;

      cursor: pointer;
    }


    #scanButton {
      background: #1f5ea8;
      color: white;
    }


    #addButton {
      background: #2e7d32;
      color: white;
    }


    #confirmButton {
      background: #2e7d32;
      color: white;
      display: none;
    }


    #preview {

      display: none;

      width: 100%;

      border-radius: 12px;

      margin-top: 15px;
    }


    #status,
    #result,
    #newForm,
    #mappingWarning {

      display: none;

      background: white;

      padding: 18px;

      border-radius: 12px;

      margin-top: 16px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }


    .success {
      color: #2e7d32;
      font-weight: 700;
    }


    .warning {
      color: #a15c00;
      font-weight: 700;
    }


    .error {
      color: #b00020;
      font-weight: 700;
    }


    .serial {

      font-size: 24px;
      font-weight: bold;

      margin: 12px 0;
    }


    .line {

      margin: 8px 0;

      font-size: 17px;
    }


    button:disabled {

      opacity: 0.6;

      cursor: default;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>📦 Inventaire matériel</h1>


  <!-- Message si les colonnes ne sont pas configurées -->

  <div id="mappingWarning">

    <div class="warning">
      ⚙️ Configuration des colonnes requise
    </div>

    <p>
      Vérifie les associations de colonnes
      dans les options du widget Grist.
    </p>

  </div>



  <!-- ===============================
       NUMÉRO DE SÉRIE
       =============================== -->


  <label for="serial">
    N° de série
  </label>


  <input
    id="serial"
    type="text"
    placeholder="Scanner ou saisir le numéro"
  >



  <!-- Champ utilisé pour lancer l'appareil photo -->

  <input
    id="barcodeImage"
    type="file"
    accept="image/*"
    capture="environment"
    style="display:none;"
  >



  <button id="scanButton">
    📷 Scanner le code-barres
  </button>



  <!-- Photo prise -->

  <img
    id="preview"
    alt="Photo du code-barres"
  >



  <!-- État du scan -->

  <div id="status"></div>



  <!-- Résultat de la recherche -->

  <div id="result"></div>



  <!-- Confirmation matériel existant -->

  <button id="confirmButton">
    ✅ Confirmer l'inventaire
  </button>



  <!-- ===============================
       NOUVEAU MATÉRIEL
       =============================== -->


  <div id="newForm">


    <h2>
      ➕ Nouveau matériel
    </h2>


    <label>
      N° de série
    </label>

    <input
      id="newNumeroSerie"
      type="text"
      readonly
    >



    <label>
      N° d'inventaire
    </label>

    <input
      id="newNumeroInventaire"
      type="text"
    >



    <label>
      Type
    </label>

    <input
      id="newType"
      type="text"
      placeholder="Ex : Point d'accès Wi-Fi"
    >



    <label>
      Marque
    </label>

    <input
      id="newMarque"
      type="text"
      placeholder="Ex : Aruba"
    >



    <label>
      Modèle
    </label>

    <input
      id="newModele"
      type="text"
      placeholder="Ex : AP 635"
    >



    <label>
      Utilisateur
    </label>

    <input
      id="newUtilisateur"
      type="text"
    >



    <label>
      Site
    </label>

    <input
      id="newSite"
      type="text"
    >



    <label>
      Localisation
    </label>

    <input
      id="newLocalisation"
      type="text"
    >



    <label>
      État
    </label>

    <select id="newEtat">

      <option value="">
        -- Choisir --
      </option>

      <option value="En service">
        En service
      </option>

      <option value="En stock">
        En stock
      </option>

      <option value="En panne">
        En panne
      </option>

      <option value="Réformé">
        Réformé
      </option>

    </select>



    <label>
      Commentaire
    </label>

    <textarea
      id="newCommentaire"
    ></textarea>



    <button id="addButton">
      💾 Ajouter à l'inventaire
    </button>


  </div>


</div>



<script>


/*
==================================================
VARIABLES
==================================================
*/


let records = [];

let currentRecordId = null;

let columnMappings = null;



/*
==================================================
ÉLÉMENTS HTML
==================================================
*/


const serialInput =
  document.getElementById("serial");


const scanButton =
  document.getElementById("scanButton");


const barcodeImage =
  document.getElementById("barcodeImage");


const preview =
  document.getElementById("preview");


const statusBox =
  document.getElementById("status");


const resultBox =
  document.getElementById("result");


const confirmButton =
  document.getElementById("confirmButton");


const newForm =
  document.getElementById("newForm");


const addButton =
  document.getElementById("addButton");


const mappingWarning =
  document.getElementById("mappingWarning");



/*
==================================================
COLONNES ATTENDUES PAR LE WIDGET
==================================================
*/


const columns = [


  {
    name: "NumeroSerie",
    title: "N° de série"
  },


  {
    name: "NumeroInventaire",
    title: "N° d'inventaire",
    optional: true
  },


  {
    name: "TypeMateriel",
    title: "Type",
    optional: true
  },


  {
    name: "Marque",
    title: "Marque",
    optional: true
  },


  {
    name: "Modele",
    title: "Modèle",
    optional: true
  },


  {
    name: "Utilisateur",
    title: "Utilisateur",
    optional: true
  },


  {
    name: "Site",
    title: "Site",
    optional: true
  },


  {
    name: "Localisation",
    title: "Localisation",
    optional: true
  },


  {
    name: "Etat",
    title: "État",
    optional: true
  },


  {
    name: "DernierInventaire",
    title: "Dernier inventaire",
    optional: true
  },


  {
    name: "Commentaire",
    title: "Commentaire",
    optional: true
  }


];



/*
==================================================
INITIALISATION GRIST
==================================================
*/


grist.ready({

  requiredAccess: "full",

  columns: columns

});



/*
==================================================
LECTURE DES DONNÉES GRIST
==================================================
*/


grist.onRecords(function(data, mappings) {


  columnMappings = mappings;


  if (!mappings) {

    records = [];

    mappingWarning.style.display =
      "block";

    return;

  }


  const mappedRecords = [];


  for (const record of data || []) {


    const mapped =
      grist.mapColumnNames(

        record,

        {
          mappings: mappings
        }

      );


    if (mapped) {

      mappedRecords.push(mapped);

    }

  }


  records =
    mappedRecords;


  mappingWarning.style.display =
    "none";


});



/*
==================================================
OUVERTURE DE L'APPAREIL PHOTO
==================================================
*/


scanButton.addEventListener(

  "click",

  function() {


    barcodeImage.click();


  }

);



/*
==================================================
TRAITEMENT DE LA PHOTO
==================================================
*/


barcodeImage.addEventListener(

  "change",

  async function() {


    const file =
      this.files[0];


    if (!file) {

      return;

    }



    resultBox.style.display =
      "none";


    newForm.style.display =
      "none";


    confirmButton.style.display =
      "none";


    statusBox.style.display =
      "block";


    statusBox.innerHTML =
      "📸 Photo reçue…";



    const imageUrl =
      URL.createObjectURL(file);



    preview.src =
      imageUrl;


    preview.style.display =
      "block";



    preview.onload =
      async function() {


        statusBox.innerHTML =
          "🔎 Analyse du code-barres…";


        try {


          const reader =
            new ZXingBrowser.BrowserMultiFormatReader();



          const result =
            await reader.decodeFromImageElement(

              preview

            );



          const serial =
            result
              .getText()
              .trim();



          serialInput.value =
            serial;



          statusBox.innerHTML = `

            <span class="success">

              ✅ Code-barres reconnu :
              ${echapperHTML(serial)}

            </span>

          `;



          rechercherMateriel(
            serial
          );


        }


        catch(error) {


          console.error(error);


          statusBox.innerHTML = `

            <div class="error">

              ❌ Aucun code-barres reconnu

            </div>

            <p>

              Essaie de reprendre la photo :

            </p>

            <p>

              • de plus près<br>
              • avec une bonne lumière<br>
              • sans reflet<br>
              • avec le code bien net

            </p>

          `;


        }


        finally {


          URL.revokeObjectURL(
            imageUrl
          );


          barcodeImage.value =
            "";


        }


      };


  }

);



/*
==================================================
RECHERCHE DANS L'INVENTAIRE
==================================================
*/


function rechercherMateriel(serial) {


  const serialNettoye =
    String(serial)
      .trim()
      .toUpperCase();



  const found =
    records.find(

      function(record) {


        return (

          String(
            record.NumeroSerie || ""
          )
            .trim()
            .toUpperCase()

          ===

          serialNettoye

        );


      }

    );



  resultBox.style.display =
    "block";



  /*
  ==================================================
  MATÉRIEL EXISTANT
  ==================================================
  */


  if (found) {


    currentRecordId =
      found.id;



    newForm.style.display =
      "none";



    resultBox.innerHTML = `


      <div class="success">

        ✅ Matériel trouvé

      </div>


      <div class="serial">

        ${echapperHTML(
          found.NumeroSerie || ""
        )}

      </div>


      <div class="line">

        <strong>N° inventaire :</strong>

        ${echapperHTML(
          found.NumeroInventaire || "-"
        )}

      </div>


      <div class="line">

        <strong>Type :</strong>

        ${echapperHTML(
          found.TypeMateriel || "-"
        )}

      </div>


      <div class="line">

        <strong>Marque :</strong>

        ${echapperHTML(
          found.Marque || "-"
        )}

      </div>


      <div class="line">

        <strong>Modèle :</strong>

        ${echapperHTML(
          found.Modele || "-"
        )}

      </div>


      <div class="line">

        <strong>Utilisateur :</strong>

        ${echapperHTML(
          found.Utilisateur || "-"
        )}

      </div>


      <div class="line">

        <strong>Site :</strong>

        ${echapperHTML(
          found.Site || "-"
        )}

      </div>


      <div class="line">

        <strong>Localisation :</strong>

        ${echapperHTML(
          found.Localisation || "-"
        )}

      </div>


      <div class="line">

        <strong>État :</strong>

        ${echapperHTML(
          found.Etat || "-"
        )}

      </div>


      <div class="line">

        <strong>Commentaire :</strong>

        ${echapperHTML(
          found.Commentaire || "-"
        )}

      </div>


    `;



    confirmButton.style.display =
      "block";


  }



  /*
  ==================================================
  NOUVEAU MATÉRIEL
  ==================================================
  */


  else {


    currentRecordId =
      null;



    resultBox.innerHTML = `


      <div class="warning">

        🆕 Nouveau matériel

      </div>


      <p>

        Le numéro de série

        <strong>
          ${echapperHTML(serial)}
        </strong>

        n'existe pas encore
        dans l'inventaire.

      </p>


    `;



    confirmButton.style.display =
      "none";



    ouvrirFormulaireNouveauMateriel(
      serial
    );


  }


}



/*
==================================================
FORMULAIRE NOUVEAU MATÉRIEL
==================================================
*/


function ouvrirFormulaireNouveauMateriel(
  serial
) {


  document.getElementById(
    "newNumeroSerie"
  ).value =
    serial;



  document.getElementById(
    "newNumeroInventaire"
  ).value =
    "";



  document.getElementById(
    "newType"
  ).value =
    "";



  document.getElementById(
    "newMarque"
  ).value =
    "";



  document.getElementById(
    "newModele"
  ).value =
    "";



  document.getElementById(
    "newUtilisateur"
  ).value =
    "";



  document.getElementById(
    "newSite"
  ).value =
    "";



  document.getElementById(
    "newLocalisation"
  ).value =
    "";



  document.getElementById(
    "newEtat"
  ).value =
    "";



  document.getElementById(
    "newCommentaire"
  ).value =
    "";



  newForm.style.display =
    "block";


}



/*
==================================================
FONCTION DE NETTOYAGE DES CHAMPS GRIST
==================================================
*/


function nettoyerChampsGrist(fields) {


  if (!fields) {

    return {};

  }



  /*
    Ces champs ne doivent jamais être
    envoyés comme valeurs de colonnes.
  */


  delete fields.id;

  delete fields.manualSort;



  /*
    Suppression de toute propriété
    vide ou invalide.
  */


  for (
    const key of Object.keys(fields)
  ) {


    if (
      !key ||
      key === "id" ||
      key === "manualSort"
    ) {


      delete fields[key];


    }


  }



  return fields;


}



/*
==================================================
AJOUT D'UN NOUVEAU MATÉRIEL
==================================================
*/


addButton.addEventListener(

  "click",

  async function() {


    if (!columnMappings) {


      alert(

        "Les colonnes du widget ne sont pas encore configurées dans Grist."

      );


      return;


    }



    const numeroSerie =

      document.getElementById(
        "newNumeroSerie"
      )
        .value
        .trim();



    if (!numeroSerie) {


      alert(

        "Le numéro de série est obligatoire."

      );


      return;


    }



    addButton.disabled =
      true;


    addButton.textContent =
      "⏳ Enregistrement…";



    try {



      const table =
        grist.getTable();



      /*
      ================================================
      VALEURS AVEC LES NOMS LOGIQUES DU WIDGET
      ================================================
      */


      const widgetFields = {


        NumeroSerie:
          numeroSerie,


        NumeroInventaire:

          document.getElementById(
            "newNumeroInventaire"
          )
            .value
            .trim(),


        TypeMateriel:

          document.getElementById(
            "newType"
          )
            .value
            .trim(),


        Marque:

          document.getElementById(
            "newMarque"
          )
            .value
            .trim(),


        Modele:

          document.getElementById(
            "newModele"
          )
            .value
            .trim(),


        Utilisateur:

          document.getElementById(
            "newUtilisateur"
          )
            .value
            .trim(),


        Site:

          document.getElementById(
            "newSite"
          )
            .value
            .trim(),


        Localisation:

          document.getElementById(
            "newLocalisation"
          )
            .value
            .trim(),


        Etat:

          document.getElementById(
            "newEtat"
          ).value,


        DernierInventaire:

          Math.floor(
            Date.now() / 1000
          ),


        Commentaire:

          document.getElementById(
            "newCommentaire"
          )
            .value
            .trim()


      };



      /*
      ================================================
      CONVERSION VERS LES COLONNES RÉELLES DE GRIST
      ================================================
      */


      let gristFields =

        grist.mapColumnNamesBack(

          widgetFields,

          {
            mappings:
              columnMappings
          }

        );



      /*
      ================================================
      SUPPRESSION id / manualSort
      ================================================
      */


      gristFields =
        nettoyerChampsGrist(
          gristFields
        );



      /*
      ================================================
      CONTRÔLE DE SÉCURITÉ
      ================================================
      */


      if (
        Object.keys(gristFields).length === 0
      ) {


        throw new Error(

          "Aucune colonne Grist valide n'a été trouvée. Vérifie le mappage des colonnes."

        );


      }



      /*
      ================================================
      CRÉATION DE LA LIGNE
      ================================================
      */


      await table.create({

        fields:
          gristFields

      });



      /*
      ================================================
      SUCCÈS
      ================================================
      */


      newForm.style.display =
        "none";


      confirmButton.style.display =
        "none";


      statusBox.style.display =
        "none";


      resultBox.style.display =
        "block";



      resultBox.innerHTML = `


        <div class="success">

          ✅ Matériel ajouté à l'inventaire

        </div>


        <div class="serial">

          ${echapperHTML(
            numeroSerie
          )}

        </div>


        <p>

          La nouvelle ligne a bien été
          créée dans Grist.

        </p>


      `;



    }


    catch(error) {


      console.error(error);


      alert(

        "Erreur lors de l'ajout dans Grist : "
        +
        (
          error.message
          ||
          String(error)
        )

      );


    }


    finally {


      addButton.disabled =
        false;


      addButton.textContent =
        "💾 Ajouter à l'inventaire";


    }


  }

);



/*
==================================================
CONFIRMATION D'UN MATÉRIEL EXISTANT
==================================================
*/


confirmButton.addEventListener(

  "click",

  async function() {


    if (!currentRecordId) {

      return;

    }



    if (!columnMappings) {


      alert(

        "Les colonnes du widget ne sont pas configurées."

      );


      return;


    }



    try {



      const table =
        grist.getTable();



      const widgetFields = {


        DernierInventaire:

          Math.floor(
            Date.now() / 1000
          )


      };



      let gristFields =

        grist.mapColumnNamesBack(

          widgetFields,

          {
            mappings:
              columnMappings
          }

        );



      gristFields =
        nettoyerChampsGrist(
          gristFields
        );



      await table.update({


        id:
          currentRecordId,


        fields:
          gristFields


      });



      resultBox.innerHTML += `


        <p class="success">

          ✅ Inventaire confirmé

        </p>


      `;



      confirmButton.style.display =
        "none";


    }


    catch(error) {


      console.error(error);


      alert(

        "Erreur lors de la mise à jour : "
        +
        (
          error.message
          ||
          String(error)
        )

      );


    }


  }

);



/*
==================================================
SAISIE MANUELLE DU NUMÉRO
==================================================
*/


serialInput.addEventListener(

  "change",

  function() {


    const serial =

      serialInput
        .value
        .trim();



    if (serial) {


      rechercherMateriel(
        serial
      );


    }


  }

);



/*
==================================================
PROTECTION HTML
==================================================
*/


function echapperHTML(value) {


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );


}


</script>


</body>

</html>
