<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Inventaire Grist</title>

  <!-- API Grist -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <!-- ZXing -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      min-height: 56px;
      padding: 14px;
      border: 1px solid #bbb;
      border-radius: 12px;
      font-size: 20px;
      margin-bottom: 15px;
      background: white;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      cursor: pointer;
    }

    #scanButton {
      background: #1f5ea8;
      color: white;
    }

    #confirmButton {
      background: #2e7d32;
      color: white;
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
      margin-bottom: 15px;
    }

    #status {
      display: none;
      margin-top: 10px;
      margin-bottom: 15px;
      padding: 14px;
      border-radius: 12px;
      background: white;
      font-size: 16px;
    }

    #result {
      display: none;
      margin-top: 15px;
      padding: 18px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .success {
      color: #2e7d32;
      font-weight: 700;
    }

    .warning {
      color: #a15c00;
      font-weight: 700;
    }

    .error {
      color: #b00020;
      font-weight: 700;
    }

    .serial {
      font-size: 24px;
      font-weight: bold;
      margin: 12px 0;
    }

    .line {
      margin: 8px 0;
      font-size: 17px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📦 Inventaire matériel</h1>

  <label for="serial">N° de série</label>

  <input
    id="serial"
    type="text"
    placeholder="Scanner ou saisir le numéro"
  >

  <input
    id="barcodeImage"
    type="file"
    accept="image/*"
    capture="environment"
    style="display:none;"
  >

  <button id="scanButton">
    📷 Scanner le code-barres
  </button>

  <img
    id="preview"
    alt="Aperçu du code-barres"
  >

  <div id="status"></div>

  <div id="result"></div>

  <button id="confirmButton">
    ✅ Confirmer l'inventaire
  </button>

</div>

<script>

  let records = [];
  let currentRecordId = null;

  const serialInput = document.getElementById("serial");
  const scanButton = document.getElementById("scanButton");
  const barcodeImage = document.getElementById("barcodeImage");
  const preview = document.getElementById("preview");
  const statusBox = document.getElementById("status");
  const resultBox = document.getElementById("result");
  const confirmButton = document.getElementById("confirmButton");

  grist.ready({
    requiredAccess: "full"
  });

  grist.onRecords(function(data) {
    records = data || [];
  });

  scanButton.addEventListener("click", function() {
    barcodeImage.click();
  });

  barcodeImage.addEventListener("change", async function() {

    const file = this.files[0];

    if (!file) {
      return;
    }

    resultBox.style.display = "none";
    confirmButton.style.display = "none";

    statusBox.style.display = "block";
    statusBox.innerHTML = "📸 Photo reçue. Préparation de l’analyse…";

    const imageUrl = URL.createObjectURL(file);

    preview.src = imageUrl;
    preview.style.display = "block";

    preview.onload = async function() {

      statusBox.innerHTML = "🔎 Analyse du code-barres en cours…";

      try {

        const reader = new ZXingBrowser.BrowserMultiFormatReader();

        const result =
          await reader.decodeFromImageElement(preview);

        const serial =
          result.getText().trim();

        serialInput.value = serial;

        statusBox.innerHTML =
          `<span class="success">✅ Code-barres reconnu : ${echapperHTML(serial)}</span>`;

        rechercherMateriel(serial);

      }

      catch(error) {

        console.error(error);

        statusBox.innerHTML = `
          <div class="error">
            ❌ Aucun code-barres reconnu
          </div>

          <p>
            Essaie de reprendre la photo :
          </p>

          <p>
            • de plus près<br>
            • avec une bonne lumière<br>
            • sans reflet<br>
            • avec le code-barres bien net<br>
            • en cadrant uniquement l’étiquette
          </p>

          <p style="font-size:14px;color:#666;">
            Détail technique :
            ${echapperHTML(error?.message || error?.name || "Erreur inconnue")}
          </p>
        `;

      }

      finally {

        URL.revokeObjectURL(imageUrl);

        barcodeImage.value = "";

      }

    };

  });

  function rechercherMateriel(serial) {

    const serialNettoye =
      String(serial)
        .trim()
        .toUpperCase();

    const found =
      records.find(function(record) {

        return (
          String(record.NumeroSerie || "")
            .trim()
            .toUpperCase()
          ===
          serialNettoye
        );

      });

    resultBox.style.display = "block";

    if (found) {

      currentRecordId = found.id;

      resultBox.innerHTML = `

        <div class="success">
          ✅ Matériel trouvé
        </div>

        <div class="serial">
          ${echapperHTML(found.NumeroSerie || "")}
        </div>

        <div class="line">
          <strong>Type :</strong>
          ${echapperHTML(found.TypeMateriel || "-")}
        </div>

        <div class="line">
          <strong>Marque :</strong>
          ${echapperHTML(found.Marque || "-")}
        </div>

        <div class="line">
          <strong>Modèle :</strong>
          ${echapperHTML(found.Modele || "-")}
        </div>

        <div class="line">
          <strong>Utilisateur :</strong>
          ${echapperHTML(found.Utilisateur || "-")}
        </div>

        <div class="line">
          <strong>Site :</strong>
          ${echapperHTML(found.Site || "-")}
        </div>

        <div class="line">
          <strong>Localisation :</strong>
          ${echapperHTML(found.Localisation || "-")}
        </div>

        <div class="line">
          <strong>État :</strong>
          ${echapperHTML(found.Etat || "-")}
        </div>
      `;

      confirmButton.style.display = "block";

    } else {

      currentRecordId = null;

      resultBox.innerHTML = `

        <div class="warning">
          🆕 Nouveau matériel
        </div>

        <p>
          Le numéro de série
          <strong>${echapperHTML(serial)}</strong>
          n'existe pas encore dans l'inventaire.
        </p>
      `;

      confirmButton.style.display = "none";

    }

  }

  confirmButton.addEventListener(
    "click",
    async function() {

      if (!currentRecordId) {
        return;
      }

      try {

        const table = await grist.getTable();

        await table.update({
          id: currentRecordId,
          fields: {
            DernierInventaire:
              Math.floor(Date.now() / 1000)
          }
        });

        resultBox.innerHTML += `
          <p class="success">
            ✅ Inventaire confirmé
          </p>
        `;

        confirmButton.style.display = "none";

      }

      catch(error) {

        alert(
          "Erreur lors de la mise à jour : "
          + error.message
        );

      }

    }
  );

  serialInput.addEventListener(
    "change",
    function() {

      const serial =
        serialInput
          .value
          .trim();

      if (serial) {
        rechercherMateriel(serial);
      }

    }
  );

  function echapperHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
