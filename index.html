<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Inventaire Grist</title>

  <!-- API Grist -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <!-- ZXing pour lire les codes-barres -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 21px;
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 52px;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 10px;
      font-size: 17px;
      background: white;
    }

    input[readonly] {
      background: #eeeeee;
      color: #555;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      margin-top: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #scanButton {
      background: #1f5ea8;
      color: white;
    }

    #addButton,
    #saveButton {
      background: #1f5ea8;
      color: white;
    }

    #confirmButton {
      background: #2e7d32;
      color: white;
    }

    #preview {
      display: none;
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
    }

    #status,
    #result,
    #newForm,
    #editForm,
    #mappingWarning {
      display: none;
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .success {
      color: #2e7d32;
      font-weight: 700;
    }

    .warning {
      color: #a15c00;
      font-weight: 700;
    }

    .error {
      color: #b00020;
      font-weight: 700;
    }

    .serial {
      font-size: 24px;
      font-weight: bold;
      margin: 12px 0;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📦 Inventaire matériel</h1>


  <!-- ==========================================
       MAPPING
       ========================================== -->

  <div id="mappingWarning">

    <div class="warning">
      ⚙️ Configuration des colonnes requise
    </div>

    <p>
      Vérifie les associations de colonnes
      dans les options du widget Grist.
    </p>

  </div>


  <!-- ==========================================
       SCANNER
       ========================================== -->

  <label for="serial">
    N° de série
  </label>

  <input
    id="serial"
    type="text"
    placeholder="Scanner ou saisir le numéro"
  >

  <input
    id="barcodeImage"
    type="file"
    accept="image/*"
    capture="environment"
    style="display:none;"
  >

  <button id="scanButton">
    📷 Scanner le code-barres
  </button>

  <img
    id="preview"
    alt="Photo du code-barres"
  >

  <div id="status"></div>

  <div id="result"></div>


  <!-- ==========================================
       MATÉRIEL EXISTANT
       ========================================== -->

  <div id="editForm">

    <h2>📝 Matériel existant</h2>


    <label>
      N° de série 🔒
    </label>

    <input
      id="editNumeroSerie"
      type="text"
      readonly
    >


    <label>
      N° d'inventaire
    </label>

    <input
      id="editNumeroInventaire"
      type="text"
    >


    <label>
      Type
    </label>

    <input
      id="editType"
      type="text"
    >


    <label>
      Marque
    </label>

    <input
      id="editMarque"
      type="text"
    >


    <label>
      Modèle
    </label>

    <input
      id="editModele"
      type="text"
    >


    <label>
      Utilisateur
    </label>

    <input
      id="editUtilisateur"
      type="text"
    >


    <label>
      Site
    </label>

    <input
      id="editSite"
      type="text"
    >


    <label>
      Localisation
    </label>

    <input
      id="editLocalisation"
      type="text"
    >


    <label>
      État
    </label>

    <select id="editEtat">

      <option value="">
        -- Choisir --
      </option>

      <option value="En service">
        En service
      </option>

      <option value="En stock">
        En stock
      </option>

      <option value="En panne">
        En panne
      </option>

      <option value="Réformé">
        Réformé
      </option>

    </select>


    <label>
      Commentaire
    </label>

    <textarea id="editCommentaire"></textarea>


    <button id="saveButton">
      💾 Enregistrer les modifications
    </button>


    <button id="confirmButton">
      ✅ Confirmer l'inventaire
    </button>

  </div>


  <!-- ==========================================
       NOUVEAU MATÉRIEL
       ========================================== -->

  <div id="newForm">

    <h2>➕ Nouveau matériel</h2>


    <label>
      N° de série 🔒
    </label>

    <input
      id="newNumeroSerie"
      type="text"
      readonly
    >


    <label>
      N° d'inventaire
    </label>

    <input
      id="newNumeroInventaire"
      type="text"
    >


    <label>
      Type
    </label>

    <input
      id="newType"
      type="text"
      placeholder="Ex : Point d'accès Wi-Fi"
    >


    <label>
      Marque
    </label>

    <input
      id="newMarque"
      type="text"
      placeholder="Ex : Aruba"
    >


    <label>
      Modèle
    </label>

    <input
      id="newModele"
      type="text"
      placeholder="Ex : AP 635"
    >


    <label>
      Utilisateur
    </label>

    <input
      id="newUtilisateur"
      type="text"
    >


    <label>
      Site
    </label>

    <input
      id="newSite"
      type="text"
    >


    <label>
      Localisation
    </label>

    <input
      id="newLocalisation"
      type="text"
    >


    <label>
      État
    </label>

    <select id="newEtat">

      <option value="">
        -- Choisir --
      </option>

      <option value="En service">
        En service
      </option>

      <option value="En stock">
        En stock
      </option>

      <option value="En panne">
        En panne
      </option>

      <option value="Réformé">
        Réformé
      </option>

    </select>


    <label>
      Commentaire
    </label>

    <textarea id="newCommentaire"></textarea>


    <button id="addButton">
      💾 Ajouter à l'inventaire
    </button>

  </div>

</div>


<script>

/* ==================================================
   VARIABLES
================================================== */

let records = [];

let currentRecordId = null;

let columnMappings = null;


/* ==================================================
   ÉLÉMENTS HTML
================================================== */

const serialInput =
  document.getElementById("serial");

const scanButton =
  document.getElementById("scanButton");

const barcodeImage =
  document.getElementById("barcodeImage");

const preview =
  document.getElementById("preview");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const newForm =
  document.getElementById("newForm");

const editForm =
  document.getElementById("editForm");

const addButton =
  document.getElementById("addButton");

const saveButton =
  document.getElementById("saveButton");

const confirmButton =
  document.getElementById("confirmButton");

const mappingWarning =
  document.getElementById("mappingWarning");


/* ==================================================
   COLONNES ATTENDUES PAR LE WIDGET
================================================== */

const columns = [

  {
    name: "NumeroSerie",
    title: "N° de série"
  },

  {
    name: "NumeroInventaire",
    title: "N° d'inventaire",
    optional: true
  },

  {
    name: "TypeMateriel",
    title: "Type",
    optional: true
  },

  {
    name: "Marque",
    title: "Marque",
    optional: true
  },

  {
    name: "Modele",
    title: "Modèle",
    optional: true
  },

  {
    name: "Utilisateur",
    title: "Utilisateur",
    optional: true
  },

  {
    name: "Site",
    title: "Site",
    optional: true
  },

  {
    name: "Localisation",
    title: "Localisation",
    optional: true
  },

  {
    name: "Etat",
    title: "État",
    optional: true
  },

  {
    name: "DernierInventaire",
    title: "Dernier inventaire",
    optional: true
  },

  {
    name: "Commentaire",
    title: "Commentaire",
    optional: true
  }

];


/* ==================================================
   INITIALISATION GRIST
================================================== */

grist.ready({

  requiredAccess: "full",

  columns: columns

});


/* ==================================================
   LECTURE DES ENREGISTREMENTS
================================================== */

grist.onRecords(function(data, mappings) {

  columnMappings =
    mappings;

  if (!mappings) {

    records = [];

    mappingWarning.style.display =
      "block";

    return;
  }

  const mappedRecords =
    [];

  for (const record of data || []) {

    const mapped =
      grist.mapColumnNames(
        record,
        {
          mappings: mappings
        }
      );

    if (mapped) {

      mappedRecords.push(
        mapped
      );

    }

  }

  records =
    mappedRecords;

  mappingWarning.style.display =
    "none";

});


/* ==================================================
   RÉCUPÉRATION D'UNE COLONNE GRIST RÉELLE

   Le mapping Grist associe par exemple :

   NumeroSerie -> vraie colonne de la table
   Etat        -> vraie colonne de la table

   Cette fonction n'autorise qu'une colonne unique.
================================================== */

function obtenirColonneGrist(nomLogique) {

  if (!columnMappings) {

    return null;

  }

  const mapping =
    columnMappings[nomLogique];

  if (!mapping) {

    return null;

  }

  /*
    Les champs de ce widget ne permettent
    pas de sélectionner plusieurs colonnes.

    Par sécurité, si Grist renvoie malgré tout
    un tableau, on prend la première colonne.
  */

  if (Array.isArray(mapping)) {

    if (mapping.length === 0) {

      return null;

    }

    return mapping[0];

  }

  return mapping;

}


/* ==================================================
   CONSTRUCTION SÉCURISÉE D'UN OBJET FIELDS

   IMPORTANT :

   Cette fonction ajoute UNIQUEMENT les champs
   qu'on lui transmet.

   Elle ne complète jamais les autres colonnes
   avec des valeurs vides.
================================================== */

function construireChampsGrist(champsLogiques) {

  const fields =
    {};

  for (
    const [nomLogique, valeur]
    of Object.entries(champsLogiques)
  ) {

    const vraieColonne =
      obtenirColonneGrist(
        nomLogique
      );

    if (
      vraieColonne &&
      vraieColonne !== "id" &&
      vraieColonne !== "manualSort"
    ) {

      fields[vraieColonne] =
        valeur;

    }

  }

  return fields;

}


/* ==================================================
   VÉRIFICATION AVANT ÉCRITURE
================================================== */

function verifierChamps(fields) {

  if (
    !fields ||
    Object.keys(fields).length === 0
  ) {

    throw new Error(
      "Aucune colonne valide n'a été trouvée. Vérifie le mappage du widget."
    );

  }

}


/* ==================================================
   OUVERTURE DU SCANNER
================================================== */

scanButton.addEventListener(
  "click",
  function() {

    barcodeImage.click();

  }
);


/* ==================================================
   TRAITEMENT DE LA PHOTO
================================================== */

barcodeImage.addEventListener(
  "change",
  async function() {

    const file =
      this.files[0];

    if (!file) {

      return;

    }

    masquerFormulaires();

    statusBox.style.display =
      "block";

    statusBox.innerHTML =
      "📸 Photo reçue…";

    const imageUrl =
      URL.createObjectURL(
        file
      );

    preview.src =
      imageUrl;

    preview.style.display =
      "block";

    preview.onload =
      async function() {

        statusBox.innerHTML =
          "🔎 Analyse du code-barres…";

        try {

          const reader =
            new ZXingBrowser.BrowserMultiFormatReader();

          const result =
            await reader.decodeFromImageElement(
              preview
            );

          const serial =
            result
              .getText()
              .trim();

          serialInput.value =
            serial;

          statusBox.innerHTML = `

            <span class="success">

              ✅ Code-barres reconnu :
              ${echapperHTML(serial)}

            </span>

          `;

          rechercherMateriel(
            serial
          );

        }

        catch(error) {

          console.error(
            error
          );

          statusBox.innerHTML = `

            <div class="error">

              ❌ Aucun code-barres reconnu

            </div>

            <p>

              Essaie de reprendre la photo
              de plus près, sans reflet
              et avec le code bien net.

            </p>

          `;

        }

        finally {

          URL.revokeObjectURL(
            imageUrl
          );

          barcodeImage.value =
            "";

        }

      };

  }
);


/* ==================================================
   RECHERCHE DU MATÉRIEL
================================================== */

function rechercherMateriel(serial) {

  const serialNettoye =
    String(serial)
      .trim()
      .toUpperCase();

  const found =
    records.find(
      function(record) {

        return (

          String(
            record.NumeroSerie || ""
          )
            .trim()
            .toUpperCase()

          ===

          serialNettoye

        );

      }
    );

  resultBox.style.display =
    "block";


  /* ================================================
     MATÉRIEL EXISTANT
  ================================================ */

  if (found) {

    /*
      L'id sert uniquement à identifier
      la ligne Grist à modifier.
    */

    currentRecordId =
      found.id;

    newForm.style.display =
      "none";

    resultBox.innerHTML = `

      <div class="success">

        ✅ Matériel trouvé

      </div>

      <div class="serial">

        ${echapperHTML(
          found.NumeroSerie || ""
        )}

      </div>

      <p>

        Tu peux modifier les informations
        ci-dessous ou simplement confirmer
        l'inventaire.

      </p>

    `;

    remplirFormulaireEdition(
      found
    );

  }


  /* ================================================
     NOUVEAU MATÉRIEL
  ================================================ */

  else {

    currentRecordId =
      null;

    editForm.style.display =
      "none";

    resultBox.innerHTML = `

      <div class="warning">

        🆕 Nouveau matériel

      </div>

      <p>

        Le numéro de série

        <strong>
          ${echapperHTML(serial)}
        </strong>

        n'existe pas encore dans l'inventaire.

      </p>

    `;

    remplirFormulaireCreation(
      serial
    );

  }

}


/* ==================================================
   REMPLISSAGE DU FORMULAIRE D'ÉDITION
================================================== */

function remplirFormulaireEdition(record) {

  document.getElementById(
    "editNumeroSerie"
  ).value =
    record.NumeroSerie || "";

  document.getElementById(
    "editNumeroInventaire"
  ).value =
    record.NumeroInventaire || "";

  document.getElementById(
    "editType"
  ).value =
    record.TypeMateriel || "";

  document.getElementById(
    "editMarque"
  ).value =
    record.Marque || "";

  document.getElementById(
    "editModele"
  ).value =
    record.Modele || "";

  document.getElementById(
    "editUtilisateur"
  ).value =
    record.Utilisateur || "";

  document.getElementById(
    "editSite"
  ).value =
    record.Site || "";

  document.getElementById(
    "editLocalisation"
  ).value =
    record.Localisation || "";

  document.getElementById(
    "editEtat"
  ).value =
    record.Etat || "";

  document.getElementById(
    "editCommentaire"
  ).value =
    record.Commentaire || "";

  editForm.style.display =
    "block";

}


/* ==================================================
   REMPLISSAGE DU FORMULAIRE DE CRÉATION
================================================== */

function remplirFormulaireCreation(serial) {

  document.getElementById(
    "newNumeroSerie"
  ).value =
    serial;

  document.getElementById(
    "newNumeroInventaire"
  ).value =
    "";

  document.getElementById(
    "newType"
  ).value =
    "";

  document.getElementById(
    "newMarque"
  ).value =
    "";

  document.getElementById(
    "newModele"
  ).value =
    "";

  document.getElementById(
    "newUtilisateur"
  ).value =
    "";

  document.getElementById(
    "newSite"
  ).value =
    "";

  document.getElementById(
    "newLocalisation"
  ).value =
    "";

  document.getElementById(
    "newEtat"
  ).value =
    "";

  document.getElementById(
    "newCommentaire"
  ).value =
    "";

  newForm.style.display =
    "block";

}


/* ==================================================
   MASQUAGE DES FORMULAIRES
================================================== */

function masquerFormulaires() {

  resultBox.style.display =
    "none";

  newForm.style.display =
    "none";

  editForm.style.display =
    "none";

}


/* ==================================================
   CRÉATION D'UN NOUVEAU MATÉRIEL
================================================== */

addButton.addEventListener(
  "click",
  async function() {

    if (!columnMappings) {

      alert(
        "Les colonnes ne sont pas configurées dans Grist."
      );

      return;

    }

    const numeroSerie =
      document.getElementById(
        "newNumeroSerie"
      )
        .value
        .trim();

    if (!numeroSerie) {

      alert(
        "Le numéro de série est obligatoire."
      );

      return;

    }

    addButton.disabled =
      true;

    addButton.textContent =
      "⏳ Enregistrement…";

    try {

      const table =
        grist.getTable();


      /*
        Pour une CRÉATION, nous voulons
        bien renseigner tous ces champs.

        DernierInventaire est initialisé
        à la date du scan.
      */

      const fields =
        construireChampsGrist({

          NumeroSerie:
            numeroSerie,

          NumeroInventaire:
            document.getElementById(
              "newNumeroInventaire"
            ).value.trim(),

          TypeMateriel:
            document.getElementById(
              "newType"
            ).value.trim(),

          Marque:
            document.getElementById(
              "newMarque"
            ).value.trim(),

          Modele:
            document.getElementById(
              "newModele"
            ).value.trim(),

          Utilisateur:
            document.getElementById(
              "newUtilisateur"
            ).value.trim(),

          Site:
            document.getElementById(
              "newSite"
            ).value.trim(),

          Localisation:
            document.getElementById(
              "newLocalisation"
            ).value.trim(),

          Etat:
            document.getElementById(
              "newEtat"
            ).value,

          DernierInventaire:
            Math.floor(
              Date.now() / 1000
            ),

          Commentaire:
            document.getElementById(
              "newCommentaire"
            ).value.trim()

        });


      verifierChamps(
        fields
      );


      await table.create({

        fields:
          fields

      });


      newForm.style.display =
        "none";

      statusBox.style.display =
        "none";

      resultBox.style.display =
        "block";

      resultBox.innerHTML = `

        <div class="success">

          ✅ Matériel ajouté à l'inventaire

        </div>

        <div class="serial">

          ${echapperHTML(
            numeroSerie
          )}

        </div>

      `;

    }

    catch(error) {

      console.error(
        error
      );

      alert(

        "Erreur lors de l'ajout : "
        +
        (
          error.message
          ||
          String(error)
        )

      );

    }

    finally {

      addButton.disabled =
        false;

      addButton.textContent =
        "💾 Ajouter à l'inventaire";

    }

  }
);


/* ==================================================
   MODIFICATION D'UN MATÉRIEL EXISTANT

   IMPORTANT :

   NumeroSerie n'est PAS envoyé.

   DernierInventaire n'est PAS envoyé.

   Ces deux colonnes ne peuvent donc
   pas être effacées par cette opération.
================================================== */

saveButton.addEventListener(
  "click",
  async function() {

    if (!currentRecordId) {

      return;

    }

    if (!columnMappings) {

      alert(
        "Les colonnes ne sont pas configurées."
      );

      return;

    }

    saveButton.disabled =
      true;

    saveButton.textContent =
      "⏳ Enregistrement…";

    try {

      const table =
        grist.getTable();


      /*
        UNIQUEMENT LES CHAMPS MODIFIABLES
      */

      const fields =
        construireChampsGrist({

          NumeroInventaire:
            document.getElementById(
              "editNumeroInventaire"
            ).value.trim(),

          TypeMateriel:
            document.getElementById(
              "editType"
            ).value.trim(),

          Marque:
            document.getElementById(
              "editMarque"
            ).value.trim(),

          Modele:
            document.getElementById(
              "editModele"
            ).value.trim(),

          Utilisateur:
            document.getElementById(
              "editUtilisateur"
            ).value.trim(),

          Site:
            document.getElementById(
              "editSite"
            ).value.trim(),

          Localisation:
            document.getElementById(
              "editLocalisation"
            ).value.trim(),

          Etat:
            document.getElementById(
              "editEtat"
            ).value,

          Commentaire:
            document.getElementById(
              "editCommentaire"
            ).value.trim()

        });


      verifierChamps(
        fields
      );


      /*
        IMPORTANT :

        fields ne contient NI NumeroSerie
        NI DernierInventaire.
      */

      await table.update({

        id:
          currentRecordId,

        fields:
          fields

      });


      resultBox.style.display =
        "block";

      resultBox.innerHTML = `

        <div class="success">

          ✅ Modifications enregistrées

        </div>

        <div class="serial">

          ${echapperHTML(
            document.getElementById(
              "editNumeroSerie"
            ).value
          )}

        </div>

        <p>

          Le numéro de série et la date
          du dernier inventaire ont été conservés.

        </p>

      `;

    }

    catch(error) {

      console.error(
        error
      );

      alert(

        "Erreur lors de la modification : "
        +
        (
          error.message
          ||
          String(error)
        )

      );

    }

    finally {

      saveButton.disabled =
        false;

      saveButton.textContent =
        "💾 Enregistrer les modifications";

    }

  }
);


/* ==================================================
   CONFIRMATION DE L'INVENTAIRE

   IMPORTANT :

   UNE SEULE COLONNE est envoyée :
   DernierInventaire
================================================== */

confirmButton.addEventListener(
  "click",
  async function() {

    if (!currentRecordId) {

      return;

    }

    if (!columnMappings) {

      alert(
        "Les colonnes ne sont pas configurées."
      );

      return;

    }

    confirmButton.disabled =
      true;

    confirmButton.textContent =
      "⏳ Confirmation…";

    try {

      const table =
        grist.getTable();


      /*
        UNE SEULE VALEUR EST CONSTRUITE.
      */

      const fields =
        construireChampsGrist({

          DernierInventaire:
            Math.floor(
              Date.now() / 1000
            )

        });


      verifierChamps(
        fields
      );


      /*
        fields contient uniquement
        la vraie colonne Grist correspondant
        à DernierInventaire.
      */

      await table.update({

        id:
          currentRecordId,

        fields:
          fields

      });


      resultBox.style.display =
        "block";

      resultBox.innerHTML = `

        <div class="success">

          ✅ Inventaire confirmé

        </div>

        <p>

          Seule la date du dernier inventaire
          vient d'être mise à jour.

        </p>

      `;

    }

    catch(error) {

      console.error(
        error
      );

      alert(

        "Erreur lors de la confirmation : "
        +
        (
          error.message
          ||
          String(error)
        )

      );

    }

    finally {

      confirmButton.disabled =
        false;

      confirmButton.textContent =
        "✅ Confirmer l'inventaire";

    }

  }
);

serialInput.addEventListener(

        .trim();

      );

);


/* ==================================================
   PROTECTION HTML
================================================== */

function echapperHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
